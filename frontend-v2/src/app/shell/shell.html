<div class="shell">
  <nav class="shell__sidebar" [attr.aria-label]="i18n.t('nav.primary')">
    <div class="shell__brand">
      <span class="shell__logo" aria-hidden="true">B</span>
      <span class="shell__brand-name">Bitácora Ops</span>
    </div>

    <div class="shell__nav">
      @for (item of navItems(); track item.path) {
        <a
          class="shell__nav-item"
          [routerLink]="['/', item.path]"
          routerLinkActive="shell__nav-item--active"
          [attr.title]="i18n.t(item.labelKey) + ' (Alt+' + item.shortcutDigit + ')'"
        >
          <mat-icon class="shell__nav-icon">{{ item.icon }}</mat-icon>
          <span class="shell__nav-label">{{ i18n.t(item.labelKey) }}</span>
          <span class="shell__shortcut mono">Alt+{{ item.shortcutDigit }}</span>
        </a>
      }
    </div>

    <div class="shell__user">
      <button type="button" class="shell__profile" [attr.title]="i18n.t('shell.profile')" (click)="openProfile()">
        <app-user-avatar [name]="displayName()" [src]="auth.user()?.avatarUrl" />
        <span class="shell__profile-name">{{ displayName() }}</span>
      </button>
      <button type="button" class="shell__icon-btn" [attr.aria-label]="i18n.t('shell.logout')" [attr.title]="i18n.t('shell.logout')" (click)="logout()">
        <mat-icon>logout</mat-icon>
      </button>
    </div>

    <div class="shell__prefs">
      <div class="shell__lang" role="group" [attr.aria-label]="i18n.t('shell.language')">
        <button type="button" class="shell__seg" [class.shell__seg--active]="prefs.language() === 'es'" [attr.aria-pressed]="prefs.language() === 'es'" (click)="prefs.language.set('es')">ES</button>
        <button type="button" class="shell__seg" [class.shell__seg--active]="prefs.language() === 'en'" [attr.aria-pressed]="prefs.language() === 'en'" (click)="prefs.language.set('en')">EN</button>
      </div>
      <button type="button" class="shell__icon-btn shell__theme" [attr.aria-label]="i18n.t(nextTheme().labelKey)" [attr.title]="i18n.t(nextTheme().labelKey)" (click)="prefs.cycleTheme()">
        <mat-icon>{{ nextTheme().icon }}</mat-icon>
      </button>
      <button
        type="button"
        class="shell__icon-btn"
        [class.shell__icon-btn--on]="prefs.dyslexiaFont()"
        [attr.aria-pressed]="prefs.dyslexiaFont()"
        [attr.aria-label]="i18n.t('shell.dyslexia')"
        [attr.title]="i18n.t('shell.dyslexia')"
        (click)="prefs.toggleDyslexiaFont()"
      >
        <mat-icon>accessible</mat-icon>
      </button>
    </div>
  </nav>

  <main class="shell__workspace">
    <router-outlet />
  </main>
</div>
