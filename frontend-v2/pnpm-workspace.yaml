# pnpm 12 exige aprobar explícitamente qué dependencias pueden correr scripts
# de instalación (protección anti supply-chain) — generado con
# `pnpm approve-builds --all --yes` tras revisar los 4 paquetes: son
# dependencias transitivas legítimas de las herramientas de build de Angular
# (esbuild) y de watchers de archivos (@parcel/watcher, lmdb,
# msgpackr-extract), no algo arbitrario. Sin esto, `pnpm install
# --frozen-lockfile` falla (ERR_PNPM_IGNORED_BUILDS) — encontrado al intentar
# el build de Docker de la Fase 3, donde el error sí frena el build (a
# diferencia de un shell local, donde el mensaje parecía no bloquear nada).
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  lmdb: true
  msgpackr-extract: true


# Exigir exactamente la versión de pnpm de `packageManager` en package.json:
# con otra versión, pnpm falla en vez de descargar la fijada o seguir. Antes
# esto vivía en un .npmrc en la raíz (package-manager-strict[-version]), que
# pnpm 12 ya no reconoce (lo reemplazó `pmOnFail`) y que npm marcaba como
# "Unknown project config".
pmOnFail: error

# @angular/build 22.2.x fija vite en 8.3.0 exacto, que arrastra avisos de
# seguridad del servidor de desarrollo (server.fs, middleware, launch-editor;
# corregidos en >=8.3.3). Se fuerza el parche del mismo minor. Quitar cuando
# @angular/build declare una vite >=8.3.3 por su cuenta.
overrides:
  vite: 8.3.5
