# Stack de Bitácora Ops 2.0 (Go + Angular + PostgreSQL 18): bitacora-db,
# bitacora-app y Caddy como único punto de entrada (http://127.0.0.1:8081).
# Variables en .env (ver .env.example). El legacy v1.x ya no vive en esta
# carpeta (../BitacoraSOC-legacy, docs/adr/0012).
#
# `name: bitacora-rewrite` se mantiene a propósito aunque el archivo ya no se
# llame .rewrite: de ese nombre dependen el volumen de datos
# (bitacora-rewrite_bitacora-db-data) y la red; cambiarlo dejaría la base
# Postgres existente huérfana.
name: bitacora-rewrite

services:
  bitacora-db:
    image: postgres:18
    container_name: bitacora-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bitacora
      POSTGRES_USER: bitacora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bitacora_dev_local}
    ports:
      - "127.0.0.1:25432:5432"
    volumes:
      # postgres:18 cambió su convención de datos: monta en /var/lib/postgresql
      # (el propio entrypoint crea la subcarpeta versionada adentro), ya NO en
      # /var/lib/postgresql/data como las imágenes <18 — montar en /data
      # rompe el arranque (comprobado al levantar este stack por primera vez).
      - bitacora-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitacora -d bitacora"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bitacora-rewrite-network

  bitacora-app:
    build:
      # Contexto = raíz del repo (no ./backend-go): el Dockerfile necesita
      # copiar también frontend-v2/ para compilar Angular (Fase 3), y Docker
      # no permite `COPY ../algo` con un contexto más chico que eso.
      context: .
      dockerfile: backend-go/Dockerfile
    container_name: bitacora-app
    restart: unless-stopped
    depends_on:
      bitacora-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bitacora:${POSTGRES_PASSWORD:-bitacora_dev_local}@bitacora-db:5432/bitacora?sslmode=disable
      HTTP_ADDR: ":8080"
      # Fase 4 (Auth). Valores de desarrollo únicamente — en un despliegue
      # real estos vienen de un secret manager, nunca hardcodeados acá.
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-dev-only-jwt-signing-key-cambiar-en-produccion}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-dkbE1vL8G50ufsA0EsATSDDsu+F1LAhKNNykSrG9Z3w=}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8081}
      RATE_LIMIT_RESET_SECRET: ${RATE_LIMIT_RESET_SECRET:-}
    networks:
      - bitacora-rewrite-network

  caddy:
    image: caddy:2-alpine
    container_name: bitacora-caddy
    restart: unless-stopped
    depends_on:
      - bitacora-app
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - bitacora-rewrite-network

networks:
  bitacora-rewrite-network:
    driver: bridge

volumes:
  bitacora-db-data:
