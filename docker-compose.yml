services:
  mongodb:
    image: mongo:8
    container_name: bitacora-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-bitacora_soc}
    volumes:
      - ./.data/mongodb_data:/data/db
      - ./.data/mongodb_config:/data/configdb
    networks:
      - bitacora-network
    # CMD-SHELL para que Mongo expanda usuario/contraseña del entorno (CMD exec no expande $VAR).
    healthcheck:
      test:
        - CMD-SHELL
        - >
          mongosh --host 127.0.0.1 --port 27017
          --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --quiet
          --eval 'db.runCommand({ ping: 1 }).ok'
          | grep -q 1 || exit 1
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 40s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: bitacora-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
      - "${BACKEND_HTTPS_PORT:-3443}:${HTTPS_PORT:-3443}"
    depends_on:
      - mongodb
    environment:
      NODE_ENV: production
      PORT: 3000
      HTTPS_PORT: ${HTTPS_PORT:-3443}
      HOST: 0.0.0.0
      HOST_DOMAIN: ${HOST_DOMAIN:-0.0.0.0}
      FRONTEND_URL: ${FRONTEND_URL:-}
      FRONTEND_PORT: ${FRONTEND_PORT:-80}
      FRONTEND_HTTPS_PORT: ${FRONTEND_HTTPS_PORT:-443}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DATABASE:-bitacora_soc}?authSource=admin
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bitacora.local}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_VERSION: ${APP_VERSION:-dev}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-300}
      RATE_LIMIT_MAX_AUTH_REQUESTS: ${RATE_LIMIT_MAX_AUTH_REQUESTS:-1200}
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-5}
      RATE_LIMIT_RESET_SECRET: ${RATE_LIMIT_RESET_SECRET:-}
      COMPLEMENT_TOKEN_SECRET: ${COMPLEMENT_TOKEN_SECRET:-}
      COMPLEMENT_MAX_DBS: ${COMPLEMENT_MAX_DBS:-5}
      COMPLEMENT_CIRCUIT_TIMEOUT_MS: ${COMPLEMENT_CIRCUIT_TIMEOUT_MS:-3000}
      COMPLEMENT_CIRCUIT_FAIL_THRESHOLD: ${COMPLEMENT_CIRCUIT_FAIL_THRESHOLD:-3}
      COMPLEMENT_CIRCUIT_RESET_MS: ${COMPLEMENT_CIRCUIT_RESET_MS:-30000}
      TZ: America/Santiago
    volumes:
      - ./.data/uploads:/app/uploads
      - ./.data/logs:/app/logs
      - ./.data/backups:/app/backups
      - ./.data/tls:/app/secrets
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - bitacora-network
      - bitacora-complements

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: bitacora-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    volumes:
      - ./.data/tls:/etc/nginx/certs
    networks:
      - bitacora-network
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1/health" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 2s

networks:
  bitacora-network:
    driver: bridge
  bitacora-complements:
    driver: bridge
