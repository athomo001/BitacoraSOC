services:
  mongodb:
    image: mongo:7
    container_name: bitacora-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-bitacora_soc}
    volumes:
      - ./.data/mongodb_data:/data/db
      - ./.data/mongodb_config:/data/configdb
    networks:
      - bitacora-network
    healthcheck:
      test:
        - CMD-SHELL
        - >
          mongosh --host localhost --port 27017
          --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin
          --quiet --eval "db.runCommand({ ping: 1 }).ok" | grep 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  init-permissions:
    image: alpine:3.20
    container_name: bitacora-init-permissions
    restart: "no"
    command: >
      sh -c "
      mkdir -p /work/backups/temp /work/uploads /work/logs &&
      chown -R 1001:1001 /work/backups /work/uploads /work/logs &&
      chmod -R ug+rwX /work/backups /work/uploads /work/logs
      "
    volumes:
      - ./.data/uploads:/work/uploads
      - ./.data/logs:/work/logs
      - ./.data/backups:/work/backups

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: bitacora-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      mongodb:
        condition: service_healthy
      init-permissions:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      HOST_DOMAIN: ${HOST_DOMAIN:-0.0.0.0}
      ALLOWED_ORIGINS: '*'
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DATABASE:-bitacora_soc}?authSource=admin
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bitacora.local}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      APP_VERSION: ${APP_VERSION:-dev}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TZ: America/Santiago
    volumes:
      - ./.data/uploads:/app/uploads
      - ./.data/logs:/app/logs
      - ./.data/backups:/app/backups
    networks:
      - bitacora-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: bitacora-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - bitacora-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  bitacora-network:
    driver: bridge
