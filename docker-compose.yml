services:
  mongodb:
    image: mongo:7
    container_name: bitacora-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-bitacora_soc}
    volumes:
      - ./.data/mongodb_data:/data/db
      - ./.data/mongodb_config:/data/configdb
    networks:
      - bitacora-network
    healthcheck:
      test:
        - CMD-SHELL
        - >
          mongosh --host localhost --port 27017 --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --quiet --eval "db.runCommand({ ping: 1 }).ok" | grep 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: bitacora-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
      - "${BACKEND_HTTPS_PORT:-3443}:${HTTPS_PORT:-3443}"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HTTPS_PORT: ${HTTPS_PORT:-3443}
      HOST: 0.0.0.0
      HOST_DOMAIN: ${HOST_DOMAIN:-0.0.0.0}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DATABASE:-bitacora_soc}?authSource=admin
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bitacora.local}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_VERSION: ${APP_VERSION:-dev}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TZ: America/Santiago
    volumes:
      - ./.data/uploads:/app/uploads
      - ./.data/logs:/app/logs
      - ./.data/backups:/app/backups
      - ./.data/tls:/app/secrets
    networks:
      - bitacora-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: bitacora-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    volumes:
      - ./.data/tls:/etc/nginx/certs
    networks:
      - bitacora-network
    command: >
      sh -c ' if [ ! -f /etc/nginx/certs/cert.pem ]; then
        echo "Generando certificados autofirmados dummy para arranque inicial de Nginx...";
        openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /etc/nginx/certs/key.pem -out /etc/nginx/certs/cert.pem -subj "/CN=localhost";
      fi; nginx -g "daemon off;" '
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "--no-check-certificate", "https://127.0.0.1/health" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  bitacora-network:
    driver: bridge
