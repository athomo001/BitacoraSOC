version: "2"
sql:
  - engine: "postgresql"
    queries: "sql/queries"
    schema: "sql/schema"
    gen:
      go:
        package: "db"
        out: "internal/repository/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "ltree"
            go_type: "string"
          # Coordenadas como *float64 (no pgtype.Numeric): NUMERIC(9,6) entra
          # holgado en un float64 y el JSON de la API las expone como número.
          - column: "territorial_units.latitude"
            go_type:
              type: "float64"
              pointer: true
          - column: "territorial_units.longitude"
            go_type:
              type: "float64"
              pointer: true
