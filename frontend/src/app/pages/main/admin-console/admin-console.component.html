<div class="admin-console">
  <nav mat-tab-nav-bar class="admin-console-nav" [tabPanel]="tabPanel" aria-label="Secciones de administración">
    <a mat-tab-link
       *ngFor="let section of sections"
       [routerLink]="section.route"
       routerLinkActive #rla="routerLinkActive"
       [active]="rla.isActive">
      <mat-icon aria-hidden="true">{{ section.icon }}</mat-icon>
      <span>{{ section.label }}</span>
    </a>
  </nav>

  <mat-tab-nav-panel #tabPanel class="admin-console-content">
    <router-outlet></router-outlet>
  </mat-tab-nav-panel>
</div>
